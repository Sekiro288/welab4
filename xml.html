<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>XML Book Catalogue</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212b;
      --muted: #5b6673;
      --line: #d9d9d9;
      --accent: #0f6b5c;
      --surface: #ffffff;
      --page: #f4f6f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--ink);
    }
    main {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    p.lede { margin: 8px 0 0; color: var(--muted); }
    nav a { color: var(--accent); font-weight: bold; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    #status { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
    #status.error { color: #b42318; font-weight: bold; }
    .books {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
    }
    .book {
      min-height: 170px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .book h2 {
      min-height: 56px;
      margin: 0 0 12px;
      font-size: 20px;
      line-height: 1.35;
    }
    .book dl {
      display: grid;
      grid-template-columns: 82px 1fr;
      gap: 8px 12px;
      margin: 0;
      font-size: 14px;
    }
    .book dt { color: var(--muted); }
    .book dd { margin: 0; overflow-wrap: anywhere; }
    @media (max-width: 560px) {
      header { align-items: start; flex-direction: column; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>XML Book Catalogue</h1>
        <p class="lede">Loaded with fetch and parsed by DOMParser.</p>
      </div>
      <nav><a href="index.html">Back to Lab 4</a></nav>
    </header>
    <p id="status">Loading books...</p>
    <section id="books" class="books" aria-live="polite"></section>
  </main>

  <script>
    fetch('book.xml')
      .then(response => {
        if (!response.ok) throw new Error('Fetch error: ' + response.status);
        return response.text();
      })
      .then(xmlText => {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
        const parseError = xmlDoc.querySelector('parsererror');
        if (parseError) throw new Error(parseError.textContent);

        const books = Array.from(xmlDoc.getElementsByTagName('book'));
        const list = document.getElementById('books');
        list.innerHTML = books.map(book => {
          const title = book.getElementsByTagName('title')[0].textContent;
          const author = book.getElementsByTagName('author')[0].textContent;
          const price = book.getElementsByTagName('price')[0].textContent;
          return `
            <article class="book">
              <h2>${title}</h2>
              <dl>
                <dt>Author</dt><dd>${author}</dd>
                <dt>Price</dt><dd>${price}</dd>
                <dt>ID</dt><dd>${book.getAttribute('id')}</dd>
              </dl>
            </article>`;
        }).join('');
        document.getElementById('status').textContent = `${books.length} books loaded from book.xml`;
      })
      .catch(err => {
        document.getElementById('status').textContent = err.message;
        document.getElementById('status').classList.add('error');
        console.error(err);
      });
  </script>
</body>
</html>
