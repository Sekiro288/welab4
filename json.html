<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>User Profiles</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18212b;
      --muted: #5b6673;
      --line: #d9d9d9;
      --accent: #235a8f;
      --surface: #ffffff;
      --page: #f4f6f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Segoe UI", sans-serif;
      background: var(--page);
      color: var(--ink);
    }
    main {
      width: min(1080px, calc(100% - 40px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; }
    p.lede { margin: 8px 0 0; color: var(--muted); }
    nav a { color: var(--accent); font-weight: bold; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    #status { margin: 0 0 16px; font-size: 14px; color: var(--muted); }
    #status.error { color: #b42318; font-weight: bold; }
    .profiles {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 16px;
    }
    .profile {
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .profile h2 {
      margin: 0 0 4px;
      font-size: 20px;
      line-height: 1.3;
    }
    .profile p.email {
      margin: 0 0 16px;
      overflow-wrap: anywhere;
      color: var(--muted);
    }
    .profile dl {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px 12px;
      margin: 0;
      font-size: 14px;
    }
    .profile dt { color: var(--muted); }
    .profile dd { margin: 0; overflow-wrap: anywhere; }
    .yes { color: #12683c; font-weight: bold; }
    .no { color: #8c3d15; font-weight: bold; }
    @media (max-width: 560px) {
      header { align-items: start; flex-direction: column; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>User Profiles</h1>
        <p class="lede">Loaded with fetch and parsed as JSON.</p>
      </div>
      <nav><a href="index.html">Back to Lab 4</a></nav>
    </header>
    <p id="status">Loading user profiles...</p>
    <section id="profiles" class="profiles" aria-live="polite"></section>
  </main>

  <script>
    const formatValue = value => value ? 'Yes' : 'No';
    const formatAddress = address =>
      `${address.street}, ${address.city}, ${address.state} ${address.zipCode}`;

    fetch('userProfiles.json')
      .then(response => {
        if (!response.ok) throw new Error('Fetch error: ' + response.status);
        return response.json();
      })
      .then(users => {
        const list = document.getElementById('profiles');
        list.innerHTML = users.map(user => {
          const { preferences, address } = user;
          return `
            <article class="profile">
              <h2>${user.firstName} ${user.lastName}</h2>
              <p class="email">${user.email}</p>
              <dl>
                <dt>Birthday</dt><dd>${user.dateOfBirth}</dd>
                <dt>Theme</dt><dd>${preferences.theme}</dd>
                <dt>Language</dt><dd>${preferences.language}</dd>
                <dt>Notifications</dt><dd class="${preferences.notifications ? 'yes' : 'no'}">${formatValue(preferences.notifications)}</dd>
                <dt>Subscription</dt><dd class="${preferences.subscription ? 'yes' : 'no'}">${formatValue(preferences.subscription)}</dd>
                <dt>Address</dt><dd>${formatAddress(address)}</dd>
              </dl>
            </article>`;
        }).join('');
        document.getElementById('status').textContent = `${users.length} profiles loaded from userProfiles.json`;
      })
      .catch(err => {
        document.getElementById('status').textContent = err.message;
        document.getElementById('status').classList.add('error');
        console.error(err);
      });
  </script>
</body>
</html>
